[Ini]
Version=1.0.0

[ScannerConfig]
# 出纸方向 0-从出纸口出纸 1-从入纸口出纸
PaperOutDirection=1
# OMR译码 0-关闭 1-开启
OMRDecodeEnable=1
# PDF417译码 0-关闭 1-开启
PDF417DecodeEnable=1
# QR译码 0-关闭 1-开启
QRDecodeEnable=0
# 一维码 0-关闭 1-开启
BarcodeDecodeEnable=0
# 裁剪纠偏，关闭后图像会有黑边 0-关闭 1-开启
AutoDeskewCrop=1

[log_mode_simple]
file_name=../log/lscanner.log
level=Log_Level_Info
mode=Log_Mode_Date
max_file_size=20971520
del_file_size=20971520
max_backup_index=5
flush_size=0
format=%D%T%E%F%L%N
SysConfFormat=%N
PidAndTid=%N
module_name=[SDK]
time_span=60
encrypt=0
delLogTime=00:00
delLogFrequency=5
delLogNum=1

